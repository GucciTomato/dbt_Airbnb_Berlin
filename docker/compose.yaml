name: aa_real_dbt_10-1226

services:
  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: standalone
    user: "1000:0"
     # shares the host network, so the SSM tunnel on 127.0.0.1 is reachable
    network_mode: host
    env_file:
      - ../.env

    environment:
      RAW_DATA_PATH: /opt/airflow/project/data
      AIRFLOW_HOME: /opt/airflow/state
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/state/airflow.db
      DBT_PROFILES_DIR: /opt/airflow/project/docker/
      AWS_CONFIG_FILE: /opt/airflow/aws/config
      AWS_SHARED_CREDENTIALS_FILE: /opt/airflow/aws/credentials
    
    volumes:
      - ../dags:/opt/airflow/dags:ro
      - ../:/opt/airflow/project
      - airflow_state:/opt/airflow/state
      - ~/.aws:/opt/airflow/aws:ro

volumes:
  airflow_state:
