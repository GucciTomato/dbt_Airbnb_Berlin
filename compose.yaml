
services:
  pipeline:
    build: .
    command: standalone

    ports:
      - "127.0.0.1:8080:8080"

    env_file:
      - .env

    environment:
      ABSOLUTE_PROJECT_DIR: /opt/airflow/project/
      RAW_DATA_PATH: /opt/airflow/project/data
      DB_HOST: host.docker.internal
      AIRFLOW_HOME: /opt/airflow/state
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/state/airflow.db

    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./:/opt/airflow/project
      - airflow_state:/opt/airflow/state

    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  airflow_state:
