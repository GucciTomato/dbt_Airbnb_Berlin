version: 2

models:
  - name: int_airbnb_cleaned__listings
    columns:
      - name: listings_id
        data_tests:
          - not_null
      - name: surrogate_key
        data_tests:
          - unique 
          - not_null
      - name: last_scraped
      - name: listings_name
      - name: description
      - name: neighborhood_overview
      - name: host_id
      - name: host_name
      - name: host_since
      - name: host_location
      - name: host_about
      - name: host_response_time
      - name: host_acceptance_rate
      - name: host_is_superhost
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: host_neighbourhood
      - name: host_listings_count
      - name: host_total_listings_count
      - name: host_verifications
      - name: host_has_profile_pic
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: host_identity_verified
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: neighbourhood_cleansed
      - name: neighbourhood_group_cleansed
      - name: property_type
      - name: room_type
      - name: accommodates
      - name: bedrooms
      - name: beds
      - name: amenities
      - name: minimum_nights
      - name: maximum_nights
      - name: calendar_updated
      - name: stay_type
        data_tests:
          - accepted_values:
              arguments: 
                values: ['long_term', 'short_term', 'weekly', 'monthly']
      - name: has_availability
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: availability_30
      - name: availability_365
      - name: calendar_last_scraped
      - name: number_of_reviews
      - name: number_of_reviews_l30d
      - name: availability_eoy
      - name: estimated_occupancy_l365d
      - name: estimated_revenue_l365d
      - name: first_review
      - name: last_review
      - name: review_scores_rating
      - name: review_scores_accuracy
      - name: review_scores_cleanliness
      - name: review_scores_checkin
      - name: review_scores_communication
      - name: review_scores_location
      - name: review_scores_value
      - name: license
      - name: instant_bookable
        data_tests:
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: calculated_host_listings_count
      - name: reviews_per_month
      - name: hosts_time_as_host_months
      - name: hosts_time_as_host_years
      - name: hosts_time_as_user_months
      - name: hosts_time_as_user_years
      - name: price_quote_price_per_night
      - name: data_cohort
  - name: int_airbnb_current__reviews
    columns:
      - name: listings_id
      - name: reviews_id
        data_tests:
          - unique
          - not_null
      - name: surrogate_key
      - name: date 
      - name: reviewer_id
      - name: comments
      - name: data_cohort
      - name: review_first_seen_cohort
  - name: int_airbnb_current__listings
    columns:
      - name: listings_id
        data_tests:
          - unique
          - not_null
      - name: cohort_date
        data_tests:
          - not_null
  - name: int_airbnb__monthly_features
    columns:
      - name: month_key
        data_tests:
          - unique
          - not_null
      - name: listings_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_airbnb_listings')
                field: listings_id
      - name: target_month
        data_tests:
          - not_null
  - name: int_airbnb_current__listings_descriptions
    columns:
      - name: listings_id
        data_tests:
          - not_null